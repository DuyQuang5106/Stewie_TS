name: TypeScript API
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  JAVA_BASELINE_REF: 4b52a4c260a57b288d58048a96565e93ba554b4f
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stiu_ci
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stiu_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run test:e2e
      - run: bun run test:integration
      - run: docker build -t stiu-api-ts:ci .
      - run: node test/docker-smoke.cjs
  read-api-parity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: read-api-test-only
          POSTGRES_DB: stiu_read_api_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Require access to the private Java baseline
        env:
          JAVA_BASELINE_READ_TOKEN: ${{ secrets.JAVA_BASELINE_READ_TOKEN }}
        run: |
          if [ -z "$JAVA_BASELINE_READ_TOKEN" ]; then
            echo '::error::Add JAVA_BASELINE_READ_TOKEN with read access to leedoekahn401/stiu_base. See README.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: leedoekahn401/stiu_base
          ref: ${{ env.JAVA_BASELINE_REF }}
          token: ${{ secrets.JAVA_BASELINE_READ_TOKEN }}
          persist-credentials: false
          path: java-baseline
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: java-baseline/demo1/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bash ./mvnw -B -DskipTests package
        working-directory: java-baseline/demo1
      - run: bun install --frozen-lockfile
      - name: Compare against Java on an isolated database
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/stiu_read_api_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: read-api-test-only
          APP_JWTSECRET: read-api-parity-secret-at-least-32-bytes
          SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID: dummy-google-client-id
          SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: dummy-google-client-secret
          READ_API_TEST_DATABASE_URL: postgresql://postgres:read-api-test-only@localhost:5432/stiu_read_api_test
        run: |
          java -jar java-baseline/demo1/target/demo1-0.0.1-SNAPSHOT.jar --server.port=18081 --app.auth.dev-login.enabled=true --app.dictionary.base-url=http://127.0.0.1:18082 > "$RUNNER_TEMP/java-baseline.log" 2>&1 &
          baseline_pid=$!
          trap 'kill "$baseline_pid" 2>/dev/null || true' EXIT
          bun run test:integration
